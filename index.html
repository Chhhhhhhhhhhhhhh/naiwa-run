<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>奶娃快跑 · 热梗跑酷</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='88'%3E%F0%9F%8D%BC%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link rel="stylesheet" href="style.css">
<link rel="preload" href="game.js" as="script">
<link rel="preload" href="assets/home-poster.webp" as="image" media="(min-aspect-ratio: 19/20)">
<link rel="preload" href="assets/home-poster-mobile.webp" as="image" media="(max-aspect-ratio: 19/20)">
</head>
<body>
<div id="stage">
  <div id="boot-backdrop" aria-hidden="true"></div>
  <div id="popups"></div>
  <div id="coach" class="hidden" role="status"></div>

  <div id="hud" class="hidden">
    <div class="hud-left">
      <div class="hud-score"><span id="score">0</span><small>米</small></div>
      <div class="hud-coins">🍼 <span id="coins">0</span></div>
      <div id="powerbars"></div>
    </div>
    <div class="hud-right">
      <div class="volume-widget" data-volume-widget>
        <button id="btn-mute" type="button" class="icon-btn volume-trigger" aria-label="调节音量" aria-expanded="false" title="调节音量 (M 静音)">🔊</button>
        <div class="volume-popover hidden" role="dialog" aria-label="音量调节">
          <button type="button" class="volume-mute-btn" aria-label="静音开关" title="静音开关 (M)">🔊</button>
          <input type="range" class="volume-slider" min="0" max="100" step="1" value="85" aria-label="总音量">
          <span class="volume-value">85%</span>
        </div>
      </div>
      <button id="btn-pause" class="icon-btn" title="暂停 (P)">⏸</button>
    </div>
  </div>

  <div id="menu" class="overlay">
    <div class="volume-widget menu-volume" data-volume-widget>
      <button id="btn-menu-volume" type="button" class="icon-btn volume-trigger" aria-label="调节音量" aria-expanded="false" title="调节音量 (M 静音)">🔊</button>
      <div class="volume-popover hidden" role="dialog" aria-label="音量调节">
        <button type="button" class="volume-mute-btn" aria-label="静音开关" title="静音开关 (M)">🔊</button>
        <input type="range" class="volume-slider" min="0" max="100" step="1" value="85" aria-label="总音量">
        <span class="volume-value">85%</span>
      </div>
    </div>
    <div class="home-panel">
      <h1 class="game-title">奶娃快跑</h1>
      <p class="tagline">沿车顶连跳，甩开豆包老师。</p>
      <div class="home-actions">
        <button id="btn-start" class="home-start"><span id="start-label">开跑</span><span class="start-arrow" aria-hidden="true">→</span></button>
        <div class="best-line"><small>最佳距离</small><strong><span id="best-menu">0</span><small>米</small></strong></div>
      </div>
      <div class="loading-panel">
        <div class="loading-copy">
          <span id="loading-stage" aria-live="polite">正在启动游戏</span>
          <span id="loading-percent">0%</span>
        </div>
        <div class="loading-track" role="progressbar" aria-label="游戏资源加载进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <span class="loading-fill" id="loading-fill"></span>
        </div>
      </div>
      <div class="howto" aria-label="操作方式">
        <div class="howto-item"><kbd class="key desktop-key">←　→</kbd><span class="key touch-key">左右滑</span><span>换道</span></div>
        <div class="howto-item"><kbd class="key desktop-key">↑ / 空格</kbd><span class="key touch-key">上滑</span><span>跳跃</span></div>
        <div class="howto-item"><kbd class="key desktop-key">↓</kbd><span class="key touch-key">下滑</span><span>滑铲</span></div>
      </div>
      <p class="meme-foot" id="menu-tip"></p>
    </div>
  </div>

  <div id="intro" class="hidden" aria-live="polite">
    <div class="intro-bar intro-bar-top"></div>
    <div class="intro-bar intro-bar-bottom"></div>
    <div class="intro-flash"></div>
    <div class="intro-card">
      <small>奶娃快跑 · 开场</small>
      <strong>作业没交</strong>
      <span>放学铃响，豆包老师就在旁边…</span>
    </div>
    <div class="intro-sfx" aria-hidden="true"></div>
    <div class="intro-line">
      <span class="intro-speaker"></span>
      <span class="intro-text"></span>
    </div>
    <button type="button" class="intro-skip" id="btn-intro-skip">跳过 <span aria-hidden="true">▸▸</span></button>
  </div>

  <div id="pause" class="overlay hidden">
    <h2 class="pause-title" id="pause-title">摸鱼中…</h2>
    <p class="pause-quip" id="pause-quip">如何呢，又能怎？先歇一下。</p>
    <div class="pause-volume" data-volume-inline aria-label="暂停界面音量调节">
      <span class="pause-volume-label">音量</span>
      <button type="button" class="volume-mute-btn" aria-label="静音开关" title="静音开关 (M)">🔊</button>
      <input type="range" class="volume-slider" min="0" max="100" step="1" value="85" aria-label="总音量">
      <span class="volume-value">85%</span>
    </div>
    <div class="over-btns">
      <button id="btn-resume" class="big-btn">继续卷</button>
      <button id="btn-pause-menu" class="big-btn ghost-btn">返回开始页</button>
    </div>
  </div>

  <div id="gameover" class="overlay hidden">
    <h2 class="over-title">芭比Q了！</h2>
    <p id="verdict" class="verdict"></p>
    <div class="over-stats">
      <div><b><span id="final-score">0</span><small class="stat-unit">米</small></b><small>本次距离</small></div>
      <div><b id="final-coins">0</b><small>奶币</small></div>
      <div><b><span id="final-best">0</span><small class="stat-unit">米</small></b><small>最佳距离</small></div>
    </div>
    <p id="new-record" class="new-record hidden">🏆 新纪录！遥遥领先！</p>
    <div class="over-btns">
      <button id="btn-restart" class="big-btn">再跑一局</button>
      <button id="btn-menu" class="big-btn ghost-btn">返回菜单</button>
    </div>
    <p class="meme-foot" id="over-foot">奶娃倒下了，但没完全倒下</p>
  </div>
</div>

<script src="vendor/three.min.js"></script>
<script src="vendor/GLTFLoader.js"></script>
<script src="models.js"></script>
<script src="audio.js"></script>
<script src="boot.js"></script>
</body>
</html>
