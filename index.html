<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>奶娃快跑 · 热梗跑酷</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='88'%3E%F0%9F%8D%BC%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <div id="popups"></div>

  <div id="hud" class="hidden">
    <div class="hud-left">
      <div class="hud-score"><span id="score">0</span><small>米</small></div>
      <div class="hud-coins">🍼 <span id="coins">0</span></div>
      <div id="powerbars"></div>
    </div>
    <div class="hud-right">
      <button id="btn-mute" title="声音开关 (M)">🔊</button>
      <button id="btn-pause" title="暂停 (P)">⏸</button>
    </div>
  </div>

  <div id="menu" class="overlay">
    <div class="title-wrap">
      <h1 class="game-title" aria-label="奶娃快跑">
        <span class="title-char" style="--i:0"><span>奶</span></span><span class="title-char" style="--i:1"><span>娃</span></span><span class="title-char" style="--i:2"><span>快</span></span><span class="title-char" style="--i:3"><span>跑</span></span>
      </h1>
      <p class="tagline" id="menu-tagline">地铁跑酷？不，是<b>奶</b>跑酷！</p>
    </div>
    <div class="howto">
      <div class="howto-item"><span class="key">← →</span><span>闪身步躲障碍</span></div>
      <div class="howto-item"><span class="key">↑ / 空格</span><span>芜湖起飞</span></div>
      <div class="howto-item"><span class="key">↓</span><span>奶蛋出击钻画饼</span></div>
      <div class="howto-item mobile-hint"><span class="key">📱</span><span>手机滑动屏幕操作</span></div>
    </div>
    <button id="btn-start" class="big-btn">开跑！</button>
    <p class="best-line">最佳纪录：<span id="best-menu">0</span> 米</p>
    <p class="meme-foot" id="menu-tip">温馨提示：跑不过 DDL 是正常的</p>
  </div>

  <div id="pause" class="overlay hidden">
    <h2 class="pause-title" id="pause-title">摸鱼中…</h2>
    <p class="pause-quip" id="pause-quip">如何呢，又能怎？先歇一下。</p>
    <div class="over-btns">
      <button id="btn-resume" class="big-btn">继续卷</button>
      <button id="btn-pause-menu" class="big-btn ghost-btn">返回开始页</button>
    </div>
  </div>

  <div id="gameover" class="overlay hidden">
    <h2 class="over-title">芭比Q了！</h2>
    <p id="verdict" class="verdict"></p>
    <div class="over-stats">
      <div><b id="final-score">0</b><small>本次米数</small></div>
      <div><b id="final-coins">0</b><small>奶币</small></div>
      <div><b id="final-best">0</b><small>最佳纪录</small></div>
    </div>
    <p id="new-record" class="new-record hidden">🏆 新纪录！遥遥领先！</p>
    <div class="over-btns">
      <button id="btn-restart" class="big-btn">再来亿把</button>
      <button id="btn-menu" class="big-btn ghost-btn">返回菜单</button>
    </div>
    <p class="meme-foot" id="over-foot">奶娃倒下了，但没完全倒下</p>
  </div>
</div>

<script src="vendor/three.min.js"></script>
<script src="vendor/GLTFLoader.js"></script>
<script src="models.js"></script>
<script src="audio.js"></script>
<script src="game.js"></script>
</body>
</html>
